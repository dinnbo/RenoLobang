<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – RenoLobang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #1D9E75; --green-dark: #0F6E56; --green-deeper: #085041;
      --green-light: #E1F5EE; --green-mid: #5DCAA5;
      --blue-light: #E6F1FB; --blue-dark: #185FA5; --blue-mid: #85B7EB;
      --amber-light: #FAEEDA; --amber-dark: #854F0B; --amber-mid: #FAC775;
      --red-light: #FCEBEB; --red: #E24B4A; --red-dark: #A32D2D; --red-mid: #F09595;
      --gray-light: #F1EFE8; --gray-mid: #B4B2A9; --gray-dark: #444441;
      --text: #1a1a1a; --text-muted: #666; --text-faint: #999;
      --border: rgba(0,0,0,0.1); --border-strong: rgba(0,0,0,0.18);
      --bg: #ffffff; --bg-secondary: #f7f7f5;
      --radius: 10px; --radius-lg: 14px;
    }
    body { font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text); background: var(--bg-secondary); line-height: 1.6; min-height: 100vh; }

    .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
    .login-card { background: #fff; border: 0.5px solid var(--border-strong); border-radius: var(--radius-lg); padding: 2rem; width: 100%; max-width: 360px; text-align: center; }
    .login-logo { font-family: 'DM Serif Display', serif; font-size: 22px; margin-bottom: 0.25rem; }
    .login-logo span { color: var(--green); }
    .login-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 1.5rem; }
    .login-card input { width: 100%; padding: 10px 14px; border: 1px solid var(--border-strong); border-radius: var(--radius); font-size: 14px; font-family: 'DM Sans', sans-serif; outline: none; margin-bottom: 10px; }
    .login-card input:focus { border-color: var(--green); }
    .login-btn { width: 100%; padding: 10px; background: var(--green); color: #fff; border: none; border-radius: var(--radius); font-size: 14px; font-family: 'DM Sans', sans-serif; font-weight: 500; cursor: pointer; }
    .login-btn:hover { background: var(--green-dark); }
    .login-error { font-size: 12px; color: var(--red-dark); margin-top: 8px; display: none; }

    .admin-screen { display: none; }
    .admin-screen.show { display: block; }

    nav { background: #fff; border-bottom: 0.5px solid var(--border); padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 52px; }
    .nav-logo { font-family: 'DM Serif Display', serif; font-size: 18px; color: var(--text); text-decoration: none; }
    .nav-logo span { color: var(--green); }
    .nav-right { display: flex; gap: 1rem; align-items: center; font-size: 13px; }
    .admin-badge { background: var(--amber-light); color: var(--amber-dark); border: 0.5px solid var(--amber-mid); padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; }
    .logout-btn { font-size: 12px; color: var(--text-muted); cursor: pointer; background: none; border: none; font-family: 'DM Sans', sans-serif; }

    .admin-main { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }
    .page-title { font-family: 'DM Serif Display', serif; font-size: 24px; font-weight: 400; margin-bottom: 0.25rem; }
    .page-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 2rem; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 2rem; }
    .stat-card { background: #fff; border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1rem; }
    .stat-card-num { font-family: 'DM Serif Display', serif; font-size: 28px; display: block; }
    .stat-card-label { font-size: 12px; color: var(--text-muted); }

    .tabs { display: flex; gap: 4px; margin-bottom: 1.25rem; border-bottom: 0.5px solid var(--border); }
    .tab-btn { padding: 8px 16px; font-size: 13px; font-family: 'DM Sans', sans-serif; border: none; background: none; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -0.5px; }
    .tab-btn.active { color: var(--green-dark); border-bottom-color: var(--green); font-weight: 500; }

    .review-admin-card { background: #fff; border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.1rem 1.25rem; margin-bottom: 10px; }
    .rac-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .rac-firm { font-size: 15px; font-weight: 500; }
    .rac-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .rac-badges { display: flex; gap: 6px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
    .rac-source { font-size: 11px; padding: 3px 8px; border-radius: 20px; }
    .src-verified { background: var(--green-light); color: var(--green-deeper); border: 0.5px solid var(--green-mid); }
    .src-unverified { background: var(--gray-light); color: var(--gray-dark); border: 0.5px solid var(--gray-mid); }
    .src-community { background: var(--blue-light); color: var(--blue-dark); border: 0.5px solid var(--blue-mid); }
    .src-media { background: var(--amber-light); color: var(--amber-dark); border: 0.5px solid var(--amber-mid); }
    .status-badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; }
    .status-pending { background: var(--amber-light); color: var(--amber-dark); border: 0.5px solid var(--amber-mid); }
    .status-approved { background: var(--green-light); color: var(--green-deeper); border: 0.5px solid var(--green-mid); }
    .status-rejected { background: var(--red-light); color: var(--red-dark); border: 0.5px solid var(--red-mid); }
    .new-firm-badge { font-size: 11px; color: var(--amber-dark); background: var(--amber-light); border: 0.5px solid var(--amber-mid); padding: 2px 6px; border-radius: 20px; margin-left: 6px; }

    .rac-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .rac-body { font-size: 13px; color: var(--text-muted); line-height: 1.55; margin-bottom: 8px; }
    .rac-body-quote { font-size: 13px; color: var(--text); line-height: 1.55; font-style: italic; border-left: 3px solid var(--border-strong); padding-left: 10px; margin-bottom: 8px; }
    .rac-details { font-size: 12px; color: var(--text-muted); display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 8px; }
    .rac-image { margin-bottom: 10px; }
    .rac-image img { max-width: 200px; max-height: 150px; border-radius: var(--radius); border: 0.5px solid var(--border); cursor: pointer; }

    .rac-actions { display: flex; gap: 8px; padding-top: 10px; border-top: 0.5px solid var(--border); flex-wrap: wrap; align-items: center; }
    .action-btn { padding: 6px 14px; font-size: 12px; font-family: 'DM Sans', sans-serif; border-radius: var(--radius); cursor: pointer; font-weight: 500; border: 0.5px solid; transition: all 0.12s; }
    .btn-approve { background: var(--green-light); color: var(--green-deeper); border-color: var(--green-mid); }
    .btn-approve:hover { background: var(--green); color: #fff; border-color: var(--green); }
    .btn-approve:disabled { background: var(--bg-secondary); color: var(--text-faint); border-color: var(--border); cursor: not-allowed; }
    .btn-reject { background: var(--red-light); color: var(--red-dark); border-color: var(--red-mid); }
    .btn-reject:hover { background: var(--red); color: #fff; border-color: var(--red); }
    .btn-reject:disabled { background: var(--bg-secondary); color: var(--text-faint); border-color: var(--border); cursor: not-allowed; }
    .action-status { font-size: 12px; color: var(--text-muted); }

    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); font-size: 13px; }
    .loading { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 13px; }
    .error-msg { background: var(--red-light); border: 0.5px solid var(--red-mid); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; color: var(--red-dark); margin-bottom: 1rem; display: none; }
    .error-msg.show { display: block; }

    @media (max-width: 480px) { .rac-header { flex-direction: column; } }
  </style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">Reno<span>Lobang</span></div>
    <div class="login-subtitle">Admin access only</div>
    <input type="password" id="pwInput" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="login-btn" onclick="doLogin()">Sign in</button>
    <div class="login-error" id="loginError">Incorrect password.</div>
  </div>
</div>

<div class="admin-screen" id="adminScreen">
  <nav>
    <a href="index.html" class="nav-logo">Reno<span>Lobang</span></a>
    <div class="nav-right">
      <span class="admin-badge">Admin</span>
      <button class="logout-btn" onclick="doLogout()">Sign out</button>
    </div>
  </nav>

  <div class="admin-main">
    <div class="page-title">Review queue</div>
    <div class="page-sub">New submissions from the public form. Click Approve to publish live instantly.</div>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><span class="stat-card-num" id="statPending">–</span><span class="stat-card-label">Pending</span></div>
      <div class="stat-card"><span class="stat-card-num" id="statApproved" style="color:var(--green)">–</span><span class="stat-card-label">Approved</span></div>
      <div class="stat-card"><span class="stat-card-num" id="statRejected" style="color:var(--red)">–</span><span class="stat-card-label">Rejected</span></div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="tabs">
      <button class="tab-btn active" onclick="setTab('pending', this)">Pending</button>
      <button class="tab-btn" onclick="setTab('approved', this)">Approved</button>
      <button class="tab-btn" onclick="setTab('rejected', this)">Rejected</button>
    </div>

    <div id="tabContent"><div class="loading">Loading...</div></div>
  </div>
</div>

<script>
  let adminPassword = '';
  let activeTab = 'pending';

  function doLogin() {
    const pw = document.getElementById('pwInput').value;
    if (!pw) return;
    adminPassword = pw;
    // Verify by trying to fetch submissions
    fetchSubmissions('pending').then(data => {
      if (data === null) {
        document.getElementById('loginError').style.display = 'block';
        adminPassword = '';
      } else {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminScreen').classList.add('show');
        renderStats();
        renderTab(data);
      }
    });
  }

  function doLogout() {
    adminPassword = '';
    document.getElementById('adminScreen').classList.remove('show');
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('pwInput').value = '';
  }

  async function fetchSubmissions(status) {
    try {
      const res = await fetch(`/.netlify/functions/submissions?status=${status}`, {
        headers: { 'x-admin-password': adminPassword }
      });
      if (res.status === 401) return null;
      if (!res.ok) throw new Error('Fetch failed');
      return await res.json();
    } catch (e) {
      showError('Could not load submissions: ' + e.message);
      return [];
    }
  }

  async function renderStats() {
    const [pending, approved, rejected] = await Promise.all([
      fetchSubmissions('pending'),
      fetchSubmissions('approved'),
      fetchSubmissions('rejected')
    ]);
    document.getElementById('statPending').textContent = pending?.length ?? '–';
    document.getElementById('statApproved').textContent = approved?.length ?? '–';
    document.getElementById('statRejected').textContent = rejected?.length ?? '–';
  }

  async function setTab(tab, el) {
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('tabContent').innerHTML = '<div class="loading">Loading...</div>';
    const data = await fetchSubmissions(tab);
    renderTab(data);
  }

  function renderTab(submissions) {
    const tab = document.getElementById('tabContent');
    if (!submissions || !submissions.length) {
      tab.innerHTML = `<div class="empty-state">No ${activeTab} submissions.</div>`;
      return;
    }
    tab.innerHTML = submissions.map(sub => renderCard(sub)).join('');
  }

  function renderCard(sub) {
    const srcMap = { verified:'src-verified', unverified:'src-unverified', community:'src-community', media:'src-media' };
    const srcLabel = { verified:'✓ Verified', unverified:'◑ Unverified', community:'◎ Community', media:'⊞ Media' };
    const isCommunity = sub.source_type === 'community';
    const bodyHtml = isCommunity
      ? `<div class="rac-body-quote">${sub.review_body}</div>`
      : `<div class="rac-body">${sub.review_body}</div>`;
    const stars = sub.rating ? '★'.repeat(sub.rating) + '☆'.repeat(5-sub.rating) : '';
    const imageHtml = sub.image_url
      ? `<div class="rac-image"><img src="${sub.image_url}" onclick="window.open('${sub.image_url}')" title="Click to view full size" /></div>`
      : '';
    const date = new Date(sub.created_at).toLocaleDateString('en-SG', { day:'numeric', month:'short', year:'numeric' });

    const isPending = sub.status === 'pending';
    const actions = isPending ? `
      <button class="action-btn btn-approve" onclick="handleAction('${sub.id}','approve',this)">✓ Approve &amp; publish</button>
      <button class="action-btn btn-reject" onclick="handleAction('${sub.id}','reject',this)">✕ Reject</button>` :
      sub.status === 'approved' ? `<span class="action-status">Published ${sub.reviewed_at ? new Date(sub.reviewed_at).toLocaleDateString('en-SG') : ''}</span>` :
      `<span class="action-status">Rejected ${sub.reviewed_at ? new Date(sub.reviewed_at).toLocaleDateString('en-SG') : ''}</span>`;

    return `<div class="review-admin-card" id="card-${sub.id}">
      <div class="rac-header">
        <div>
          <div class="rac-firm">${sub.firm_name}${sub.is_new_firm ? '<span class="new-firm-badge">New firm</span>' : ''}</div>
          <div class="rac-meta">Submitted ${date} · ${sub.author_name || 'Anonymous'}${sub.author_email ? ' · ' + sub.author_email : ''}</div>
        </div>
        <div class="rac-badges">
          <span class="rac-source ${srcMap[sub.source_type]}">${srcLabel[sub.source_type]}</span>
          <span class="status-badge status-${sub.status}">${sub.status}</span>
        </div>
      </div>
      ${sub.review_title ? `<div class="rac-title">${sub.review_title}</div>` : ''}
      ${bodyHtml}
      ${imageHtml}
      <div class="rac-details">
        ${stars ? `<span style="color:#EF9F27">${stars}</span>` : ''}
        ${sub.property_type ? `<span>${sub.property_type}</span>` : ''}
        ${sub.contract_month && sub.contract_year ? `<span>Completed: ${sub.contract_month}/${sub.contract_year}</span>` : ''}
        ${sub.tags ? `<span>Tags: ${sub.tags}</span>` : ''}
        ${sub.source_url ? `<span><a href="${sub.source_url}" target="_blank" style="color:var(--blue-dark)">View original ↗</a></span>` : ''}
        ${sub.reddit_username ? `<span>${sub.reddit_username}</span>` : ''}
        ${sub.media_url ? `<span><a href="${sub.media_url}" target="_blank" style="color:var(--blue-dark)">Article ↗</a></span>` : ''}
      </div>
      <div class="rac-actions">${actions}</div>
    </div>`;
  }

  async function handleAction(id, action, btn) {
    const card = document.getElementById('card-' + id);
    const buttons = card.querySelectorAll('.action-btn');
    buttons.forEach(b => { b.disabled = true; });
    btn.textContent = action === 'approve' ? 'Publishing...' : 'Rejecting...';

    try {
      const res = await fetch('/.netlify/functions/approve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
        body: JSON.stringify({ submissionId: id, action })
      });
      const data = await res.json();
      if (res.ok && data.success) {
        const actionsEl = card.querySelector('.rac-actions');
        if (action === 'approve') {
          actionsEl.innerHTML = `<span class="action-status" style="color:var(--green)">✓ Published live – site updating now</span>`;
        } else {
          actionsEl.innerHTML = `<span class="action-status">Rejected</span>`;
        }
        renderStats();
      } else {
        buttons.forEach(b => { b.disabled = false; });
        btn.textContent = action === 'approve' ? '✓ Approve & publish' : '✕ Reject';
        showError('Action failed: ' + (data.error || 'Unknown error'));
      }
    } catch (e) {
      buttons.forEach(b => { b.disabled = false; });
      btn.textContent = action === 'approve' ? '✓ Approve & publish' : '✕ Reject';
      showError('Network error: ' + e.message);
    }
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 6000);
  }
</script>
</body>
</html>
